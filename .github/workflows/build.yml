name: build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build (Linux Qt5 + WebKit)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            qtbase5-dev qtbase5-dev-tools qttools5-dev-tools \
            libqt5webkit5-dev qtmultimedia5-dev libsqlite3-dev

      - name: Build
        run: |
          mkdir -p _build
          cd _build
          qmake CONFIG+=release PREFIX=/usr ../QuiteRSS.pro
          make -j"$(nproc)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiterss-linux-x86_64
          path: _build/release/target/*

  build-windows:
    name: Build (Windows MSYS2 Qt5 + WebKit)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-angleproject
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qt5-translations
            mingw-w64-x86_64-qtwebkit
            mingw-w64-x86_64-sqlite3

      - name: Build
        shell: msys2 {0}
        run: |
          mkdir -p _build
          cd _build
          qmake-qt5 CONFIG+=release QMAKE_LRELEASE=/mingw64/bin/lrelease-qt5 ../QuiteRSS.pro
          mingw32-make -j"$(nproc)"

      - name: Package
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p dist
          cp _build/release/target/QuiteRSS.exe dist/
          windeployqt-qt5 --release --dir dist dist/QuiteRSS.exe

          # QtWebKit out-of-process helpers (if present in this QtWebKit build)
          for exe in QtWebProcess.exe QtWebNetworkProcess.exe QtWebStorageProcess.exe; do
            if [ -f "/mingw64/bin/$exe" ]; then cp -n "/mingw64/bin/$exe" dist/; fi
          done

          # Collect every non-system MinGW runtime DLL that the app and the
          # deployed Qt DLLs depend on, and put it next to the executable.
          # This covers libstdc++-6.dll, libgcc_s_seh-1.dll, libwinpthread-1.dll,
          # ICU, zlib and friends.
          copy_runtime() {
            find dist -type f \( -name "*.exe" -o -name "*.dll" \) | while read -r f; do
              ldd "$f" 2>/dev/null | awk '/=> \/mingw64\/bin\// {print $3}'
            done | sort -u | while read -r dll; do
              cp -n "$dll" dist/ 2>/dev/null || true
            done
          }
          copy_runtime
          copy_runtime

          # OpenSSL is loaded at runtime by Qt5Network, so ldd does not see it.
          cp -n /mingw64/bin/libssl-*.dll /mingw64/bin/libcrypto-*.dll dist/ 2>/dev/null || true

          # Application data files: translations, styles, sounds, web widgets.
          mkdir -p dist/lang
          cp -n _build/release/target/lang/*.qm dist/lang/ 2>/dev/null || true
          cp -n /mingw64/share/qt5/translations/qtbase_*.qm dist/lang/ 2>/dev/null || true
          cp -rn style dist/ 2>/dev/null || true
          cp -rn sound dist/ 2>/dev/null || true
          cp -rn html dist/ 2>/dev/null || true

          # Critical GCC runtime DLLs must be present or the app cannot start.
          for dll in libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll; do
            if [ ! -f "dist/$dll" ]; then
              echo "ERROR: missing $dll"
              exit 1
            fi
          done

          # TLS and translation files required at runtime.
          for f in libssl-3-x64.dll libcrypto-3-x64.dll lang/quiterss_zh_CN.qm; do
            if [ ! -f "dist/$f" ]; then
              echo "ERROR: missing $f"
              exit 1
            fi
          done

          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiterss-windows-x86_64
          path: dist
